<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title id="metaTitle">Product — Prichoy Clothing</title>
  <meta name="description" id="metaDesc" content="Shop premium clothing at Prichoy.">
  <meta property="og:site_name" content="Prichoy Clothing">
  <meta property="og:type" content="product">
  <meta property="og:title" id="ogTitle" content="Prichoy Clothing">
  <meta property="og:description" id="ogDesc" content="">
  <meta property="og:image" id="ogImage" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" id="canonicalLink" href="">
  <link rel="stylesheet" href="../css/style.css">
  <script type="application/ld+json" id="productSchema"></script>
  <script type="application/ld+json" id="breadcrumbSchema"></script>
  <style>
    /* ── PDP Phase 5 additions ── */
    .pdp-loading { display:grid; grid-template-columns:1fr 1fr; gap:32px; padding:80px 48px; max-width:1200px; margin:0 auto; }
    .skel { background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-title { height:32px; width:75%; margin-bottom:12px; }
    .skel-price { height:48px; width:40%; margin-bottom:16px; }
    .skel-desc { height:80px; width:100%; }
    .pdp-skeleton-gallery { height:500px; border-radius:16px; background:#f0f0f0; }
    .pdp-skeleton-info { display:flex; flex-direction:column; gap:12px; }
    .pdp-meta-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .pdp-cat { font-size:.65rem; letter-spacing:2px; text-transform:uppercase; color:var(--ink-muted); font-weight:700; }
    .pdp-review-summary { display:flex; align-items:center; gap:8px; margin:4px 0 12px; font-size:.85rem; }
    .pdp-stars { font-size:1rem; letter-spacing:1px; }
    .pdp-review-avg { font-weight:700; }
    .pdp-review-count { color:var(--ink-muted); text-decoration:none; }
    .pdp-review-count:hover { text-decoration:underline; }
    .pdp-qty { display:flex; align-items:center; gap:12px; margin:18px 0; }
    .pdp-qty .qty-b { width:36px; height:36px; border:1.5px solid var(--ink-line); border-radius:50%; background:none; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:all .2s; }
    .pdp-qty .qty-b:hover { background:var(--ink); color:#fff; border-color:var(--ink); }
    .pdp-qty #qtyVal { font-size:1.1rem; font-weight:700; min-width:24px; text-align:center; }
    .pdp-cta { display:flex; gap:12px; margin-top:4px; }
    .pdp-btn { flex:1; height:52px; border-radius:var(--r-full); font-size:.8rem; letter-spacing:1.5px; }
    .pdp-btn-wish { background:none; border:2px solid var(--ink-line); color:var(--ink); }
    .pdp-btn-wish.loved { background:var(--women); border-color:var(--women); color:#fff; }
    .pdp-buy-now { width:100%; margin-top:10px; height:48px; border-radius:var(--r-full); border:2px solid var(--ink); background:none; color:var(--ink); font-size:.8rem; letter-spacing:1.5px; cursor:pointer; transition:all .2s; }
    .pdp-buy-now:hover { background:var(--ink); color:#fff; }
    .pdp-trust { margin:20px 0; border:1.5px solid var(--ink-line); border-radius:12px; overflow:hidden; }
    .trust-row { display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:.8rem; border-bottom:1px solid var(--ink-line); }
    .trust-row:last-child { border-bottom:none; }
    .pdp-accordion { border:1.5px solid var(--ink-line); border-radius:10px; margin-top:10px; overflow:hidden; }
    .pdp-accordion summary { padding:14px 18px; cursor:pointer; font-size:.8rem; font-weight:700; letter-spacing:.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; }
    .pdp-accordion summary::-webkit-details-marker { display:none; }
    .pdp-accordion summary::after { content:'＋'; font-size:.9rem; }
    .pdp-accordion[open] summary::after { content:'−'; }
    .pdp-accord-body { padding:0 18px 14px; font-size:.85rem; color:var(--ink-soft); line-height:1.7; }
    .g-badge { position:absolute; top:14px; left:14px; background:var(--err); color:#fff; font-size:.6rem; font-weight:700; letter-spacing:1.5px; padding:4px 10px; border-radius:var(--r-full); }
    .size-guide-link { font-size:.68rem; color:var(--green); font-weight:600; text-decoration:none; text-transform:none; letter-spacing:0; }
    .pdp-error { text-align:center; padding:100px 24px; font-family:var(--ff-serif); font-style:italic; color:var(--ink-muted); font-size:1.1rem; }
    /* Reviews section */
    .reviews-section,.gallery-section { max-width:900px; margin:60px auto; padding:0 24px; }
    .section-title { font-family:var(--ff-serif); font-size:1.6rem; margin-bottom:32px; }
    .rating-breakdown { display:flex; gap:32px; align-items:center; padding:24px; background:rgba(255,255,255,.6); border:1.5px solid var(--ink-line); border-radius:16px; margin-bottom:28px; }
    .rating-big { font-size:3rem; font-weight:800; font-family:var(--ff-serif); }
    .rating-big span { font-size:1.2rem; color:var(--ink-muted); }
    .rating-bars { flex:1; display:flex; flex-direction:column; gap:6px; }
    .rating-bar-row { display:flex; align-items:center; gap:8px; font-size:.78rem; }
    .rating-bar { flex:1; height:8px; background:var(--ink-line); border-radius:4px; overflow:hidden; }
    .rating-bar-fill { height:100%; background:#f59e0b; border-radius:4px; transition:width .5s; }
    .review-card { padding:24px; border:1.5px solid var(--ink-line); border-radius:14px; margin-bottom:16px; background:rgba(255,255,255,.6); }
    .review-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
    .review-stars { font-size:1rem; letter-spacing:1px; }
    .verified-badge { font-size:.65rem; font-weight:700; letter-spacing:.5px; color:var(--green-2); background:rgba(34,197,94,.1); padding:2px 8px; border-radius:var(--r-full); margin-left:8px; }
    .review-date { font-size:.72rem; color:var(--ink-muted); }
    .review-name { font-size:.8rem; font-weight:700; margin-bottom:6px; }
    .review-title { font-size:.9rem; font-weight:700; margin-bottom:4px; }
    .review-body { font-size:.85rem; line-height:1.7; color:var(--ink-soft); margin:0; }
    .review-photos { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .review-photo { width:80px; height:80px; object-fit:cover; border-radius:8px; cursor:pointer; }
    .helpful-btn { margin-top:12px; font-size:.75rem; background:none; border:1.5px solid var(--ink-line); border-radius:var(--r-full); padding:5px 14px; cursor:pointer; transition:all .2s; }
    .helpful-btn:hover { background:var(--ink); color:#fff; border-color:var(--ink); }
    .review-cta { text-align:center; margin-top:28px; padding-top:28px; border-top:1.5px solid var(--ink-line); }
    .review-login-hint { font-size:.85rem; color:var(--ink-soft); }
    .empty-reviews { text-align:center; padding:40px; font-style:italic; color:var(--ink-muted); font-family:var(--ff-serif); }
    /* Gallery */
    .customer-gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
    .gallery-tile img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; transition:transform .3s; }
    .gallery-tile img:hover { transform:scale(1.04); }
    /* Review modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal-box { background:#fff; border-radius:20px; padding:32px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .modal-head h3 { font-family:var(--ff-serif); font-size:1.3rem; }
    .modal-head button { background:none; border:none; font-size:1.4rem; cursor:pointer; }
    .stars-input { display:flex; gap:8px; margin-bottom:16px; font-size:2rem; }
    .star-pick { cursor:pointer; color:#ddd; transition:color .15s; }
    .star-pick.active,.star-pick:hover,.star-pick.hover { color:#f59e0b; }
    .stars-input .star-pick:hover ~ .star-pick { color:#ddd !important; }
    .modal-actions { display:flex; gap:10px; margin-top:16px; }
    .check-row { display:flex; align-items:center; gap:8px; font-size:.85rem; margin:10px 0; cursor:pointer; }
    .f-ctrl { display:block; width:100%; padding:10px 14px; border:1.5px solid var(--ink-line); border-radius:8px; font-size:.85rem; margin-bottom:10px; font-family:inherit; }
    .pdp-stock-dot.out { background:var(--err); }
    .pdp-stock-dot.low { background:var(--amber,#f59e0b); }
  </style>
</head>
<body>
<div id="navMount"></div><div id="cartMount"></div><div id="authMount"></div>

<main id="pdpMain">
  <div class="pdp-loading">
    <div class="pdp-skeleton-gallery skel"></div>
    <div class="pdp-skeleton-info">
      <div class="skel skel-title"></div>
      <div class="skel skel-price"></div>
      <div class="skel skel-desc"></div>
    </div>
  </div>
</main>

<section id="reviewsSection" style="display:none" class="reviews-section">
  <h2 class="section-title">Customer Reviews</h2>
  <div id="reviewsContent"></div>
</section>

<section id="gallerySection" style="display:none" class="gallery-section">
  <h2 class="section-title">Customer Photos</h2>
  <div id="galleryGrid" class="customer-gallery-grid"></div>
</section>

<div id="footerMount"></div>
<div id="toastWrap" class="toast-wrap"></div>

<div id="reviewModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="Write a review">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Write a Review</h3>
      <button onclick="document.getElementById('reviewModal').style.display='none'" aria-label="Close">✕</button>
    </div>
    <div class="stars-input" id="starsInput" role="radiogroup" aria-label="Rating">
      <span class="star-pick" data-v="1" role="radio" aria-label="1 star" tabindex="0">★</span>
      <span class="star-pick" data-v="2" role="radio" aria-label="2 stars" tabindex="0">★</span>
      <span class="star-pick" data-v="3" role="radio" aria-label="3 stars" tabindex="0">★</span>
      <span class="star-pick" data-v="4" role="radio" aria-label="4 stars" tabindex="0">★</span>
      <span class="star-pick" data-v="5" role="radio" aria-label="5 stars" tabindex="0">★</span>
    </div>
    <input id="revTitle" class="f-ctrl" placeholder="Review title (optional)" maxlength="100">
    <textarea id="revBody" class="f-ctrl" rows="4" placeholder="Share your experience..." maxlength="2000"></textarea>
    <label class="check-row"><input type="checkbox" id="revAnon"> Post anonymously</label>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('reviewModal').style.display='none'">Cancel</button>
      <button class="btn btn-black" id="revSubmitBtn">Submit Review</button>
    </div>
  </div>
</div>

<script src="../js/components.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById("navMount").innerHTML    = renderNav("shop", true);
  document.getElementById("cartMount").innerHTML   = renderCart();
  document.getElementById("authMount").innerHTML   = renderAuthModal();
  document.getElementById("footerMount").innerHTML = renderFooter(true);

  var slug = new URLSearchParams(window.location.search).get("slug");
  var p = null;
  var selSizeVal = null, selColorId = null, selQty = 1, selRating = 0;
  var activeColorImages = [];

  function galleryForColor(colorId) {
    if (!p) return [];
    if (colorId) {
      var col = p.colors.find(function(c){ return c.id === colorId; });
      if (col && col.images && col.images.length) return col.images;
    }
    return p.images || [];
  }
  function galleryImg(idx) {
    var imgs = activeColorImages.length ? activeColorImages : (p ? p.images : []);
    var img = imgs[idx];
    if (!img) return 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=700&q=80';
    return img.url || img.thumbnailUrl || 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=700&q=80';
  }
  function renderThumbs() {
    var imgs = activeColorImages.length ? activeColorImages : (p ? p.images : []);
    if (!imgs.length) return '';
    return imgs.map(function(img, i) {
      return '<div class="g-thumb '+(i===0?'on':'')+'" onclick="setMainImg('+i+',this)" role="button" tabindex="0"><img src="'+(img.thumbnailUrl||img.url)+'" alt="" loading="lazy"></div>';
    }).join('');
  }
  function setMainImg(idx, el) {
    var mainImg = document.getElementById('gMainImg');
    if (mainImg) mainImg.src = galleryImg(idx);
    document.querySelectorAll('.g-thumb').forEach(function(t){ t.classList.remove('on'); });
    if (el) el.classList.add('on');
  }
  function selCol(colorId, el) {
    selColorId = colorId;
    document.querySelectorAll('.col-dot').forEach(function(d){ d.classList.remove('on'); d.setAttribute('aria-checked','false'); });
    el.classList.add('on'); el.setAttribute('aria-checked','true');
    activeColorImages = galleryForColor(colorId);
    document.getElementById('gThumbs').innerHTML = renderThumbs();
    var mainImg = document.getElementById('gMainImg');
    if (mainImg) mainImg.src = galleryImg(0);
    updateStock();
  }
  function selSz(size, el) {
    selSizeVal = size;
    document.querySelectorAll('.sz-btn').forEach(function(b){ b.classList.remove('on'); b.setAttribute('aria-selected','false'); });
    el.classList.add('on'); el.setAttribute('aria-selected','true');
    updateStock();
  }
  function updateStock() {
    if (!p) return;
    var variant = findVariant(p, selSizeVal, selColorId);
    var stockEl = document.getElementById('pdpStock');
    var addBtn  = document.getElementById('pdpAddCart');
    var buyBtn  = document.getElementById('pdpBuyNow');
    if (!stockEl) return;
    if (!selSizeVal) { stockEl.innerHTML = '<span class="pdp-stock-dot"></span>Select a size'; return; }
    if (variant && variant.stock <= 0) {
      stockEl.innerHTML = '<span class="pdp-stock-dot out"></span><span style="color:var(--err)">Out of Stock</span>';
      if (addBtn) addBtn.disabled = true; if (buyBtn) buyBtn.disabled = true;
    } else if (variant && variant.stock <= 5) {
      stockEl.innerHTML = '<span class="pdp-stock-dot low"></span><span style="color:#f59e0b">Only '+variant.stock+' left!</span>';
      if (addBtn) addBtn.disabled = false; if (buyBtn) buyBtn.disabled = false;
    } else {
      stockEl.innerHTML = '<span class="pdp-stock-dot"></span>In Stock — Ready to Ship';
      if (addBtn) addBtn.disabled = false; if (buyBtn) buyBtn.disabled = false;
    }
  }
  function renderStars(rating, total) {
    var stars = Array.from({length:5}, function(_,i){ return i < Math.round(rating) ? '★' : '☆'; }).join('');
    return stars;
  }
  function injectSEO(prod) {
    var title = (prod.seoTitle || prod.name) + ' — Prichoy Clothing';
    document.title = title;
    document.getElementById('metaTitle').textContent = title;
    var desc = prod.seoDescription || prod.shortDescription || prod.description || '';
    desc = desc.replace(/<[^>]+>/g,'').slice(0,160);
    document.getElementById('metaDesc').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', title);
    document.getElementById('ogDesc').setAttribute('content', desc);
    document.getElementById('ogImage').setAttribute('content', prod.images?.[0]?.url || '');
    var canonical = 'https://prichoy.com/pages/product.html?slug='+encodeURIComponent(prod.slug);
    document.getElementById('canonicalLink').setAttribute('href', canonical);
    document.getElementById('productSchema').textContent = JSON.stringify({
      "@context":"https://schema.org/","@type":"Product",
      "name":prod.name,"description":desc,
      "image":prod.images?prod.images.map(function(i){return i.url;}):[],
      "brand":{"@type":"Brand","name":"Prichoy"},
      "offers":{"@type":"Offer","priceCurrency":"BDT","price":prod.price,
        "availability":"https://schema.org/InStock","url":window.location.href}
    });
    document.getElementById('breadcrumbSchema').textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"BreadcrumbList",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":"https://prichoy.com"},
        {"@type":"ListItem","position":2,"name":"Shop","item":"https://prichoy.com/pages/shop.html"},
        {"@type":"ListItem","position":3,"name":prod.name,"item":window.location.href}
      ]
    });
  }
  function buildPage(prod) {
    p = prod;
    selColorId = p.colors[0]?.id ?? null;
    selSizeVal = null; selQty = 1;
    activeColorImages = galleryForColor(selColorId);
    injectSEO(p);
    var disc = p.originalPrice ? Math.round((1-p.price/p.originalPrice)*100) : 0;
    var accentBtn = p.gender === 'men' ? 'btn-men' : 'btn-women';
    document.getElementById('pdpMain').innerHTML = `
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a><span class="sep" aria-hidden="true">›</span>
        <a href="shop.html">Shop</a><span class="sep" aria-hidden="true">›</span>
        <span aria-current="page">${p.name}</span>
      </nav>
      <div class="pdp-wrap">
        <div class="pdp-gallery">
          <div class="g-main" id="gMain" style="position:relative">
            <img id="gMainImg" src="${galleryImg(0)}" alt="${p.name}" loading="eager"
              onerror="this.src='https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=700&q=80'">
            ${disc>=5?`<span class="g-badge">${disc}% OFF</span>`:''}
          </div>
          <div class="g-thumbs" id="gThumbs" role="list" aria-label="Product images">${renderThumbs()}</div>
        </div>
        <div class="pdp-info">
          <div class="pdp-meta-top">
            <span class="pdp-cat">${p.category}</span>
            ${p.badge?`<span class="p-card-badge badge-${p.badge.toLowerCase().replace(/\s+/g,'-')}">${p.badge}</span>`:''}
          </div>
          <h1 class="pdp-name">${p.name}</h1>
          <div class="pdp-review-summary" id="pdpReviewSummary">
            <span class="pdp-stars">☆☆☆☆☆</span>
            <span class="pdp-review-count">Loading reviews…</span>
          </div>
          <div class="pdp-stock" id="pdpStock"><span class="pdp-stock-dot"></span>Select a size</div>
          <div class="pdp-price">
            <span class="pdp-price-now">৳${p.price.toLocaleString()}</span>
            ${p.originalPrice?`<span class="pdp-price-was">৳${p.originalPrice.toLocaleString()}</span>`:''}
            ${disc>=5?`<span class="pdp-price-pct">${disc}% OFF</span>`:''}
          </div>
          ${p.shortDescription?`<p class="pdp-desc">${p.shortDescription}</p>`:''}
          ${(p.colors.length>1||p.colors[0]?.id)?`
          <div class="opt-label">Colour: <strong id="colName">${p.colors[0]?.name||''}</strong></div>
          <div class="color-opts" id="colOpts" role="group" aria-label="Colour options">
            ${p.colors.map(function(c,i){return `<div class="col-dot ${i===0?'on':''}" style="background:${c.hex}" onclick="selCol('${c.id}',this);document.getElementById('colName').textContent='${c.name}'" title="${c.name}" role="radio" aria-label="${c.name}" aria-checked="${i===0?'true':'false'}"></div>`;}).join('')}
          </div>`:''}
          <div class="opt-label">Size${p.sizeGuide?` &nbsp;<a href="#sizeGuide" class="size-guide-link">Size Guide</a>`:''}</div>
          <div class="size-opts" id="sizeOpts" role="group" aria-label="Size options">
            ${p.sizes.map(function(s){return `<button class="sz-btn" onclick="selSz('${s}',this)" aria-label="Size ${s}" aria-selected="false">${s}</button>`;}).join('')}
          </div>
          <div class="pdp-qty">
            <button class="qty-b" onclick="selQty=Math.max(1,selQty-1);document.getElementById('qtyVal').textContent=selQty" aria-label="Decrease">−</button>
            <span id="qtyVal" aria-live="polite">1</span>
            <button class="qty-b" onclick="selQty=Math.min(10,selQty+1);document.getElementById('qtyVal').textContent=selQty" aria-label="Increase">+</button>
          </div>
          <div class="pdp-cta">
            <button class="btn btn-black pdp-btn ${accentBtn}" id="pdpAddCart" onclick="doPdpAdd()">🛍 Add to Cart</button>
            <button class="btn pdp-btn pdp-btn-wish ${isWished(p.id)?'loved':''}" id="pdpWishBtn" onclick="wishToggle('${p.id}');refreshPdpWish()" aria-label="Wishlist">
              ${isWished(p.id)?'♥':'♡'} Wishlist
            </button>
          </div>
          <button class="btn pdp-buy-now" id="pdpBuyNow" onclick="doPdpBuyNow()">⚡ Buy Now — COD</button>
          <div class="pdp-trust">
            <div class="trust-row"><span>🚚</span><span>48hr delivery within Dhaka City</span></div>
            <div class="trust-row"><span>💵</span><span>Cash on delivery — pay at your door</span></div>
            <div class="trust-row"><span>🔄</span><span>Easy 7-day exchange policy</span></div>
            <div class="trust-row"><span>✅</span><span>100% genuine Prichoy product</span></div>
          </div>
          ${p.description?`<details class="pdp-accordion"><summary>Product Details</summary><div class="pdp-accord-body">${p.description}</div></details>`:''}
          ${(p.fabric||p.care)?`<details class="pdp-accordion"><summary>Material & Care</summary><div class="pdp-accord-body">${p.fabric?`<p><strong>Material:</strong> ${p.fabric}</p>`:''} ${p.care?`<p><strong>Care:</strong> ${p.care}</p>`:''}</div></details>`:''}
          ${p.sizeGuide?`<details class="pdp-accordion" id="sizeGuide"><summary>Size Guide</summary><div class="pdp-accord-body">${p.sizeGuide.imageUrl?`<img src="${p.sizeGuide.imageUrl}" alt="Size guide" style="max-width:100%;border-radius:8px;margin-bottom:8px">`:''} ${p.sizeGuide.notes?`<p>${p.sizeGuide.notes}</p>`:''}</div></details>`:''}
        </div>
      </div>`;
    updateStock();
  }
  function doPdpAdd(){if(!p)return;if(!selSizeVal){toast('Please select a size first','err');return;}var v=findVariant(p,selSizeVal,selColorId);cartAdd(p,selQty,selSizeVal,selColorId,v);}
  function doPdpBuyNow(){if(!p)return;if(!selSizeVal){toast('Please select a size first','err');return;}doPdpAdd();setTimeout(function(){window.location.href='checkout.html';},300);}
  function refreshPdpWish(){var btn=document.getElementById('pdpWishBtn');if(!btn||!p)return;var w=isWished(p.id);btn.classList.toggle('loved',w);btn.innerHTML=(w?'♥':'♡')+' Wishlist';}

  // ── Reviews ──────────────────────────────────────────────────
  function loadReviews(productId){
    api.getProductReviews(productId,{limit:6}).then(function(res){
      var data=res.data; if(!data) return;
      var section=document.getElementById('reviewsSection');
      var content=document.getElementById('reviewsContent');
      var summaryEl=document.getElementById('pdpReviewSummary');
      if(summaryEl){
        if(data.stats&&data.stats.total>0){
          summaryEl.innerHTML=`<span class="pdp-stars" style="color:#f59e0b">${renderStars(data.stats.average)}</span><span class="pdp-review-avg">${data.stats.average.toFixed(1)}</span><a href="#reviewsSection" class="pdp-review-count">(${data.stats.total} review${data.stats.total!==1?'s':''})</a>`;
        } else {
          summaryEl.innerHTML='<a href="#reviewsSection" class="pdp-review-count">Be the first to review ↓</a>';
        }
      }
      if(data.stats&&data.stats.total>0){
        content.innerHTML=`<div class="rating-breakdown"><div class="rating-big">${data.stats.average.toFixed(1)}<span>/5</span></div><div class="rating-bars">${[5,4,3,2,1].map(function(n){var c=data.stats.breakdown[n]||0;var pct=data.stats.total>0?Math.round(c/data.stats.total*100):0;return `<div class="rating-bar-row"><span>${n}★</span><div class="rating-bar"><div class="rating-bar-fill" style="width:${pct}%"></div></div><span>${c}</span></div>`;}).join('')}</div></div>`;
      } else { content.innerHTML=''; }
      if(data.reviews&&data.reviews.length){
        content.innerHTML+=data.reviews.map(function(r){
          return `<div class="review-card"><div class="review-header"><div><span class="review-stars" style="color:#f59e0b">${renderStars(r.rating)}</span>${r.isVerified?'<span class="verified-badge">✓ Verified Purchase</span>':''}</div><span class="review-date">${new Date(r.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span></div><div class="review-name">${r.customerName||'Customer'}</div>${r.title?`<div class="review-title">${r.title}</div>`:''} ${r.body?`<p class="review-body">${r.body}</p>`:''} ${r.photos&&r.photos.length?`<div class="review-photos">${r.photos.map(function(u){return `<img src="${u}" alt="Review photo" class="review-photo" loading="lazy">`;}).join('')}</div>`:''}<button class="helpful-btn" onclick="voteReview('${r.id}',this)">👍 Helpful (${r.helpfulCount||0})</button></div>`;
        }).join('');
      } else {
        content.innerHTML+='<p class="empty-reviews">No reviews yet — be the first to share!</p>';
      }
      var canReview=customerAuth.isLoggedIn();
      content.innerHTML+=`<div class="review-cta">${canReview?'<button class="btn btn-black" onclick="openReviewModal()">✍ Write a Review</button>':'<p class="review-login-hint">Bought this? <a href="#" onclick="openAuth(\'login\');return false;">Sign in</a> to leave a review.</p>'}</div>`;
      section.style.display='';
    }).catch(function(){});
  }
  function voteReview(reviewId,btn){
    if(!customerAuth.isLoggedIn()){toast('Sign in to vote','err');return;}
    customerApi.voteHelpful(reviewId).then(function(res){
      var cur=parseInt(btn.textContent.match(/\d+/)?.[0]||'0');
      btn.textContent='👍 Helpful ('+(res.data.helpful?cur+1:Math.max(0,cur-1))+')';
      toast(res.data.helpful?'Marked helpful':'Vote removed','ok');
    }).catch(function(e){toast(e.message,'err');});
  }
  function openReviewModal(){if(!customerAuth.isLoggedIn()){openAuth('login');return;}selRating=0;document.querySelectorAll('.star-pick').forEach(function(s){s.classList.remove('active');});document.getElementById('revTitle').value='';document.getElementById('revBody').value='';document.getElementById('reviewModal').style.display='flex';}

  // Star picker
  document.querySelectorAll('.star-pick').forEach(function(star){
    star.addEventListener('click',function(){
      selRating=parseInt(star.dataset.v);
      document.querySelectorAll('.star-pick').forEach(function(s,i){s.classList.toggle('active',i<selRating);});
    });
    star.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')star.click();});
  });
  document.getElementById('revSubmitBtn').addEventListener('click',function(){
    if(!p)return;
    if(!selRating){toast('Please select a rating','err');return;}
    customerApi.submitReview({productId:p.id,rating:selRating,title:document.getElementById('revTitle').value.trim()||undefined,body:document.getElementById('revBody').value.trim()||undefined,isAnonymous:document.getElementById('revAnon').checked}).then(function(){document.getElementById('reviewModal').style.display='none';toast('Review submitted — pending moderation. Thank you! 💚','ok');}).catch(function(e){toast(e.message,'err');});
  });

  // ── Gallery ──────────────────────────────────────────────────
  function loadGallery(productId){
    api.getProductGallery(productId).then(function(res){
      var photos=res.data?.photos||[];if(!photos.length)return;
      var allUrls=[];photos.forEach(function(p){(p.photoUrls||[]).forEach(function(url){allUrls.push(url);});});
      if(!allUrls.length)return;
      document.getElementById('galleryGrid').innerHTML=allUrls.slice(0,12).map(function(url){return `<div class="gallery-tile"><img src="${url}" alt="Customer photo" loading="lazy"></div>`;}).join('');
      document.getElementById('gallerySection').style.display='';
    }).catch(function(){});
  }

  // ── Init ─────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async function(){
    if(!slug){document.getElementById('pdpMain').innerHTML='<div class="pdp-error">Product not found. <a href="shop.html">Continue shopping →</a></div>';return;}
    try{
      var res=await api.getProductBySlug(slug);
      var raw=res.data;
      p=adaptProduct(raw);
      buildPage(p);
      loadReviews(raw.id);
      loadGallery(raw.id);
    } catch(e){
      document.getElementById('pdpMain').innerHTML='<div class="pdp-error">Product could not be loaded. <a href="shop.html">Continue shopping →</a></div>';
    }
  });
</script>
</body>
</html>
