<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Track Your Order — Prichoy Clothing</title>
  <meta name="description" content="Track your Prichoy order in real-time. Enter your order number and phone to see the full delivery timeline.">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .track-hero{text-align:center;padding:60px 24px 40px;background:linear-gradient(135deg,#f0f7f0,#fff);}
    .track-hero h1{font-family:var(--ff-serif);font-size:2.2rem;margin-bottom:8px;}
    .track-hero p{font-size:.9rem;color:var(--ink-soft);margin-bottom:32px;}
    .track-form{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
    .track-form input{padding:13px 18px;border:2px solid var(--ink-line);border-radius:12px;font-size:.9rem;font-family:inherit;transition:border .2s;}
    .track-form input:focus{outline:none;border-color:var(--men);}
    .track-result{max-width:640px;margin:32px auto;padding:0 20px 80px;}
    .order-header{background:rgba(255,255,255,.8);border:1.5px solid var(--ink-line);border-radius:20px;padding:24px;margin-bottom:28px;}
    .order-header-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .ohlabel{font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px;}
    .ohval{font-size:.9rem;font-weight:700;}
    .timeline{position:relative;}
    .timeline::before{content:'';position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--ink-line);}
    .tl-step{display:flex;gap:20px;padding-bottom:32px;position:relative;}
    .tl-step:last-child{padding-bottom:0;}
    .tl-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border:2.5px solid var(--ink-line);background:#fff;position:relative;z-index:1;transition:all .4s;}
    .tl-step.done .tl-icon{background:var(--men);border-color:var(--men);color:#fff;box-shadow:0 0 0 4px rgba(0,84,196,.12);}
    .tl-step.current .tl-icon{background:var(--men);border-color:var(--men);color:#fff;box-shadow:0 0 0 8px rgba(0,84,196,.12);animation:pulse-icon 2s infinite;}
    .tl-step.failed .tl-icon{background:var(--err);border-color:var(--err);color:#fff;}
    @keyframes pulse-icon{0%,100%{box-shadow:0 0 0 4px rgba(0,84,196,.12);}50%{box-shadow:0 0 0 12px rgba(0,84,196,.06);}}
    .tl-body{padding-top:8px;}
    .tl-title{font-weight:800;font-size:.88rem;margin-bottom:3px;}
    .tl-desc{font-size:.78rem;color:var(--ink-soft);line-height:1.6;}
    .tl-time{font-size:.7rem;color:var(--ink-muted);margin-top:4px;}
    .tl-step.upcoming .tl-title,.tl-step.upcoming .tl-desc{color:var(--ink-muted);}
    .empty-track{text-align:center;padding:48px 24px;font-family:var(--ff-serif);font-size:1.1rem;font-style:italic;color:var(--ink-muted);}
    .track-items{background:rgba(255,255,255,.7);border:1.5px solid var(--ink-line);border-radius:16px;padding:20px;margin-top:24px;}
    .track-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ink-line);font-size:.85rem;}
    .track-item-row:last-child{border-bottom:none;}
    @media(max-width:520px){.order-header-grid{grid-template-columns:1fr;}.track-hero h1{font-size:1.7rem;}}
  </style>
</head>
<body>
<div id="navMount"></div><div id="cartMount"></div><div id="authMount"></div>

<div class="track-hero">
  <h1>Track Your Order</h1>
  <p>Enter your order number and phone number to see your delivery status.</p>
  <form class="track-form" id="trackForm">
    <input id="trackOrderNo" placeholder="Order number (e.g. PR-2025-00001)" required autocomplete="off" inputmode="text">
    <input id="trackPhone" type="tel" placeholder="Phone number (e.g. 01XXXXXXXXX)" required inputmode="tel" autocomplete="tel">
    <button class="btn btn-black" type="submit" id="trackBtn">Track Order</button>
  </form>
</div>

<div id="trackResult" class="track-result"></div>

<div id="footerMount"></div>
<div id="toastWrap" class="toast-wrap"></div>
<script src="../js/components.js"></script>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById("navMount").innerHTML    = renderNav("track", true);
  document.getElementById("cartMount").innerHTML   = renderCart();
  document.getElementById("authMount").innerHTML   = renderAuthModal();
  document.getElementById("footerMount").innerHTML = renderFooter(true);

  var STEPS = [
    { status:"PENDING",    icon:"📋", label:"Order Placed",     desc:"We've received your order and are getting it ready." },
    { status:"CONFIRMED",  icon:"✅", label:"Confirmed",         desc:"Your order has been confirmed and payment noted." },
    { status:"PACKED",     icon:"📦", label:"Packed",            desc:"Items packed and sealed, ready for courier pickup." },
    { status:"DISPATCHED", icon:"🚚", label:"Shipped",           desc:"Your parcel is on its way with the courier." },
    { status:"OUT_FOR_DELIVERY", icon:"🏠", label:"Out for Delivery", desc:"Your courier is nearby — keep your phone handy!" },
    { status:"DELIVERED",  icon:"🎉", label:"Delivered",         desc:"Order delivered successfully. Enjoy your purchase!" },
  ];
  var TERMINAL = {
    CANCELLED: { icon:"❌", label:"Cancelled",  desc:"This order has been cancelled.",       cls:"failed" },
    RETURNED:  { icon:"🔄", label:"Returned",   desc:"The item has been returned.",           cls:"failed" },
    EXCHANGED: { icon:"↔️",  label:"Exchanged",  desc:"The item has been exchanged.",          cls:"done"  },
  };

  function renderTimeline(order) {
    var status = order.status;
    if (TERMINAL[status]) {
      return `<div class="tl-step failed"><div class="tl-icon">${TERMINAL[status].icon}</div><div class="tl-body"><div class="tl-title">${TERMINAL[status].label}</div><div class="tl-desc">${TERMINAL[status].desc}</div></div></div>`;
    }
    var currentIdx = STEPS.findIndex(s => s.status === status);
    if (status === 'DELIVERED') currentIdx = STEPS.length - 1;
    return STEPS.map(function(step, i) {
      var cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : 'upcoming';
      return `<div class="tl-step ${cls}">
        <div class="tl-icon">${i <= currentIdx ? step.icon : '◯'}</div>
        <div class="tl-body">
          <div class="tl-title">${step.label}</div>
          <div class="tl-desc">${i <= currentIdx ? step.desc : 'Pending'}</div>
          ${i === 0 && order.createdAt ? `<div class="tl-time">${new Date(order.createdAt).toLocaleString('en-BD',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
          ${i === currentIdx && i > 0 && order.updatedAt ? `<div class="tl-time">Updated: ${new Date(order.updatedAt).toLocaleString('en-BD',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
          ${step.status === 'DELIVERED' && order.deliveredAt ? `<div class="tl-time">${new Date(order.deliveredAt).toLocaleString('en-BD',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function renderResult(order) {
    return `
      <div class="order-header">
        <div class="order-header-grid">
          <div><div class="ohlabel">Order Number</div><div class="ohval">${order.orderNumber || order.orderNo}</div></div>
          <div><div class="ohlabel">Status</div><div class="ohval">${order.status}</div></div>
          <div><div class="ohlabel">Total</div><div class="ohval">৳${Number(order.grandTotal).toLocaleString()}</div></div>
          <div><div class="ohlabel">Delivery Area</div><div class="ohval">${order.district || '—'}${order.thana ? ', '+order.thana : ''}</div></div>
        </div>
        ${order.trackingCode ? `<div style="margin-top:14px;padding:10px 14px;background:rgba(0,84,196,.06);border-radius:10px;font-size:.78rem;font-weight:700">Courier Tracking: ${order.trackingCode}</div>` : ''}
      </div>
      <div class="timeline">${renderTimeline(order)}</div>
      ${order.items && order.items.length ? `
      <div class="track-items">
        <div style="font-size:.75rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;color:var(--ink-muted)">Items</div>
        ${order.items.map(function(item) {
          return `<div class="track-item-row">
            <span>${item.productName || item.name || '—'}${item.size ? ` (${item.size})` : ''}</span>
            <span>×${item.quantity} &nbsp; ৳${Number(item.totalPrice || item.unitPrice * item.quantity).toLocaleString()}</span>
          </div>`;
        }).join('')}
      </div>` : ''}`;
  }

  document.getElementById('trackForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('trackBtn');
    btn.disabled = true; btn.textContent = 'Tracking…';
    var orderNo = document.getElementById('trackOrderNo').value.trim();
    var phone = document.getElementById('trackPhone').value.trim();
    try {
      var res = await api.trackOrder(orderNo, phone);
      document.getElementById('trackResult').innerHTML = renderResult(res.data);
    } catch(err) {
      document.getElementById('trackResult').innerHTML = `<div class="empty-track">❌ ${err.message || 'Order not found. Please check your details.'}<br><br><small>Make sure the phone number matches the one used when ordering.</small></div>`;
    } finally { btn.disabled = false; btn.textContent = 'Track Order'; }
  });

  // Auto-fill from URL token (linked from order confirmation / account page)
  document.addEventListener('DOMContentLoaded', async function() {
    await loadProductsCache();
    loadState(); refreshCartUI(); refreshAuthUI(); initNav();
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (token) {
      try {
        var res = await fetch(API_BASE+'/track/'+token);
        var data = await res.json();
        if (data.success && data.data) {
          document.getElementById('trackResult').innerHTML = renderResult(data.data);
          document.getElementById('trackForm').style.display = 'none';
          document.querySelector('.track-hero p').textContent = 'Live tracking for your order:';
        }
      } catch(e) {}
    }
  });
</script>
</body>
</html>
